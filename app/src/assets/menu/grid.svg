  <g fill="url(#symbol)" fill-opacity=".35"><rect x="17.5" y="7.5" width="7" height="7" rx="2"/><rect x="7.5" y="17.5" width="7" height="7" rx="2"/></g>
  <path d="M10 10h2M20 20h2" stroke="#E6F7FF" stroke-opacity=".6" stroke-width="1.5" stroke-linecap="round"/>
