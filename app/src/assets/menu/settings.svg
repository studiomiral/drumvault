      <feComposite in2="lightEdge" operator="in" result="lightEdge"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="depth"/><feMergeNode in="lightEdge"/><feMergeNode in="SourceGraphic"/></feMerge>
