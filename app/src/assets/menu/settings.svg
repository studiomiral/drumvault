    </linearGradient>
    <linearGradient id="symbol" x1="11" y1="7" x2="21" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A9DC5"/><stop offset=".55" stop-color="#354063"/><stop offset="1" stop-color="#354063"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(8 3) rotate(55) scale(22 27)" gradientUnits="userSpaceOnUse">
