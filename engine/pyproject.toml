[project]
name = "drumvault-engine"
version = "0.1.0"
description = "Drumvault analysis/processing sidecar: stem zips -> drum sample library"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "pydantic>=2.6",
    # Primary key detector (EDMA profile). key.py falls back to a numpy/librosa
    # detector if this import fails, so it may be dropped if it won't install.
    "essentia>=2.1b6.dev1110",
    "pyloudnorm>=0.2",
    "pedalboard>=0.9.26",
    "mido>=1.3",
    "zstandard>=0.22",
    "cbor2>=5.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drumvault_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
